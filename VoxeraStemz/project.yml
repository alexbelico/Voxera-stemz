name: VoxeraStemz
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  VoxeraStemz:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/algorithms-seed.json
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: Security.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.voxerastemz
        PRODUCT_NAME: VoxeraStemz
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    scheme:
      testTargets:
        - VoxeraStemzTests
        - VoxeraStemzUITests
  VoxeraStemzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Resources/algorithms-seed.json
        buildPhase: resources
    dependencies:
      - target: VoxeraStemz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.voxerastemz.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VoxeraStemz.app/VoxeraStemz
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
  VoxeraStemzUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: VoxeraStemz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alex.voxerastemz.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VoxeraStemz
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
